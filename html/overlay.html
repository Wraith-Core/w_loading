<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wraith Core</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <!-- The loading curtain: drawn over every transition between the character selection, the
       creator and the spawn (exports.w_loading:Show / Hide). Fully transparent when hidden. -->
  <div class="curtain" id="curtain" aria-hidden="true">
    <div class="grain" aria-hidden="true"></div>
    <div class="c-foot">
      <div class="c-mark" id="c-mark">
        <span class="c-primary" id="c-primary"></span>
        <span class="c-second" id="c-second"></span>
      </div>
      <p class="c-status t-label" id="text" aria-live="polite"></p>
      <p class="c-sub" id="sub"></p>
      <div class="c-track" aria-hidden="true"><i></i></div>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>

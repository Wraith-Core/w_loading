<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wraith Core</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="loading.css">
</head>
<body>
  <!-- 1. the plate: a real survey photograph, at most two layers (the one on screen and the one developing over it) -->
  <div class="plates" id="plates" aria-hidden="true"></div>
  <!-- 2. scrims (bottom band for the type, top band for the caption, the plate-edge burn) and 3. grain -->
  <div class="scrim" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- 4. type -->
  <div class="ui" id="ui">
    <header class="top">
      <div class="caption">
        <p class="cap-body" id="cap-body">
          <span class="cap-no t-num" id="cap-no"></span>
          <span class="cap-title" id="cap-title"></span>
          <span class="cap-credit" id="cap-credit"></span>
        </p>
      </div>
      <div class="music" id="music">
        <button type="button" class="music-toggle t-label" id="music-toggle" aria-pressed="false">
          <span id="music-label"></span> <b id="music-state"></b>
        </button>
        <input type="range" class="music-vol" id="music-vol" min="0" max="1" step="0.01" value="0.25">
      </div>
    </header>

    <section class="mark">
      <p class="welcome" id="welcome" hidden></p>
      <h1 class="wordmark" id="wordmark">
        <span class="wm-primary" id="wm-primary"></span>
        <span class="wm-second" id="wm-second"></span>
      </h1>
      <p class="tagline" id="tagline"></p>
    </section>

    <aside class="tip" id="tip" hidden>
      <p class="tip-head t-label"><span id="tip-label"></span><span class="tip-count t-num" id="tip-count"></span></p>
      <p class="tip-text" id="tip-text"></p>
    </aside>

    <footer class="load" id="load">
      <div class="load-row">
        <span class="status t-label" id="status" aria-live="polite"></span>
        <span class="pct t-num"><b id="pct">0</b><small>%</small></span>
      </div>
      <div class="track" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <i class="fill"></i><i class="tick"></i>
      </div>
    </footer>

    <p class="legal">
      <span id="legal"></span>
      <span class="contact" id="contact" hidden></span>
    </p>
  </div>

  <script src="plates.js"></script>
  <script src="loading.js"></script>
</body>
</html>
